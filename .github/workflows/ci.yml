name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type, unit, and build checks
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/e34-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/e34-preview.log
          exit 1

      - name: Run the learner journey
        env:
          E34_LAB_URL: http://127.0.0.1:4173
        run: npm run test:e2e

      - name: Keep browser evidence after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
